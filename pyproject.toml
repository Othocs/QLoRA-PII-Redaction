[project]
name = "pii-gateway"
version = "0.1.0"
description = "Self-hosted PII redaction gateway with a QLoRA-tuned small LLM detector (English)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
dependencies = [
    "pyyaml>=6.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
data = [
    "huggingface-hub>=0.25",
    "datasketch>=1.6",
]
presidio = [
    "presidio-analyzer>=2.2.358",
    "spacy>=3.8,<3.9",
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
]
presidio-lg = [
    "en-core-web-lg @ https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.8.0/en_core_web_lg-3.8.0-py3-none-any.whl",
]
gliner = [
    "gliner>=0.2.21",
    "transformers>=4.51",
    "torch>=2.4",
]
train = [
    "trl>=1.0",
    "peft>=0.15",
    "datasets>=3.0",
    "accelerate>=1.4",
    "transformers>=5.10",
    "torch>=2.4",
    "bitsandbytes>=0.45; sys_platform == 'linux'",
]
# GPU inference with JSON-constrained decoding. vLLM pins its own torch, so it
# can't share an environment with the gliner extra (see [tool.uv] conflicts).
llm = [
    "vllm>=0.10.2; sys_platform == 'linux'",
]
serve = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "cryptography>=43",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
conflicts = [[{ extra = "llm" }, { extra = "gliner" }]]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/pii_gateway"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "data"]
markers = [
    "slow: needs model downloads (deselect with '-m \"not slow\"')",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["data/raw", "data/processed"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
